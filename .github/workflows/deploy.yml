name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy-web:
    name: Build & Deploy Web (GitHub Pages root)
    runs-on: ubuntu-latest
    concurrency: pages-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.27.4
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --base-href=/

      - name: Copy deep-linking verification files
        run: |
          cp -r hosting/.well-known build/web/.well-known

      - name: Copy AdSense & AdMob verification files (ads.txt, app-ads.txt, robots.txt)
        run: |
          cp web/ads.txt build/web/ads.txt
          cp web/app-ads.txt build/web/app-ads.txt
          cp web/robots.txt build/web/robots.txt

      - name: Add 404.html for deep-link refresh support
        run: |
          cp build/web/index.html build/web/404.html

      - name: Deploy to GitHub Pages (root user-page repo)
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: jagadeeshmurthym4-lgtm/jagadeeshmurthym4-lgtm.github.io
          publish_branch: main
          publish_dir: ./build/web
          force_orphan: true

  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    concurrency: pages-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.27.4
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Diagnose environment (helpful when the build fails)
        run: |
          flutter doctor -v
          echo "--- Android SDK root: $ANDROID_SDK_ROOT ---"
          ls -1 "$ANDROID_SDK_ROOT/ndk" 2>/dev/null || echo "no NDK dir found"
          echo "--- free memory ---"
          free -h

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aab-release
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
