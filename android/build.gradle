allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// Force all projects to compile against API 36 for targetSdk compliance
allprojects {
    project.plugins.whenPluginAdded { plugin ->
        if (plugin.class.name.contains('com.android.build.gradle.BasePlugin') ||
            plugin.class.name.contains('com.android.build.gradle.AppPlugin') ||
            plugin.class.name.contains('com.android.build.gradle.LibraryPlugin')) {
            project.android.compileSdk = 36
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
