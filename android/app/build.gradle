plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.spydev.funpay"
    compileSdk = 36
    ndkVersion = "27.0.12077973" // Hardcoded to match plugin requirements (flutter.ndkVersion resolves to 26.x causing warnings)

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.spydev.funpay"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    def keystorePropertiesFile = rootProject.file("key.properties")
    def keystoreProps = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystoreProps.load(new FileInputStream(keystorePropertiesFile))
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProps['keyAlias']
                keyPassword = keystoreProps['keyPassword']
                storeFile = keystoreProps['storeFile'] ? file(keystoreProps['storeFile']) : null
                storePassword = keystoreProps['storePassword']
            }
        }
    }
    buildTypes {
        release {
            // Use the release keystore when key.properties exists (local builds),
            // otherwise fall back to debug signing so CI can produce artifacts too.
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled = true
            proguardFiles(
                getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
            )
        }
    }
}

flutter {
    source = "../.."
}
