# Keep the Gradle daemon within the ~7GB available on standard GitHub Actions runners
# (prevents OOM during Kotlin/R8 with split-per-abi; local dev machines can raise this).
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
